name: astrbot_plugin_user_gateway # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 萌萌权限控制台 # 用于展示的名字
desc: 按好友 / 按群细粒度管控 LLM 使用权限与 token 额度，并提供全面的用量统计与可视化控制台。 # 插件简短描述
short_desc: 好友与群的 LLM 权限、token 限额与用量统计控制台。 # 插件市场卡片短描述
version: v1.4.2 # 插件版本号（唯一来源）

author: windExplorer # 作者（须与插件市场源的 author 一致，即 GitHub 用户名）
author_url: https://github.com/windExplorer # 作者主页
repo: https://github.com/windExplorer/astrbot_plugin_user_gateway # 插件的仓库地址
category: utilities # 插件市场分类（英文 key 枚举）
tags: # 插件市场标签
  - 权限管理
  - 限额
  - 用量统计
  - LLM 管控
astrbot_version: ">=4.22.0" # 要求的 AstrBot 版本范围
support_platforms: # 支持的适配器平台（好友/群列表同步依赖 aiocqhttp 的 OneBot 接口）
  - aiocqhttp

# 插件 WebUI 页面：AstrBot 自动把 pages/<name>/index.html 挂载到
# /pages/<插件名>/<name>/，后端 API 通过 context.register_web_api 注册。
pages:
  - name: permission-console
    title: 萌萌权限控制台
